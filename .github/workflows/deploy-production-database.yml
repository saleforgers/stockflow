name: Deploy production database migrations

on:
  workflow_dispatch:
    inputs:
      backup_public_key:
        description: Base64 RSA public key for the encrypted pre-migration backup
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stockflow-production-database
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply reviewed Prisma migrations
    runs-on: ubuntu-latest
    environment: production
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Read-only migration preflight
        run: node scripts/preflight-release-database.mjs

      - name: Back up public schema and data with encryption
        env:
          BACKUP_PUBLIC_KEY: ${{ inputs.backup_public_key }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-backup
          node scripts/dump-release-database.mjs |
            node scripts/encrypt-release-backup.mjs release-backup/public-schema.dump.encrypted

      - name: Preserve encrypted backup before migration
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-pre-migration-backup
          path: release-backup/public-schema.dump.encrypted
          retention-days: 7
          if-no-files-found: error

      - name: Apply committed migrations
        run: npm run db:migrate:deploy

      - name: Verify release schema and migration checksums
        run: npx tsx scripts/verify-release-readiness.ts
