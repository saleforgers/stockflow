name: Verify production database readiness

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stockflow-production-database
  cancel-in-progress: false

jobs:
  verify:
    name: Read-only production schema verification
    runs-on: ubuntu-latest
    environment: production
    env:
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify release schema and migration checksums
        run: npx tsx scripts/verify-release-readiness.ts
